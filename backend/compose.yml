services:
  serverdeck-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serverdeck-backend
    hostname: srv-01
    restart: unless-stopped
    init: true

    environment:
      TZ: Europe/Rome
      SERVERDECK_LISTEN: "0.0.0.0:8080"
      SERVERDECK_CONFIG: /app/config/services.yml
      SERVERDECK_DB: /app/data/serverdeck.db
      SERVERDECK_TOKEN: ${SERVERDECK_TOKEN:-serverdeck-dev-secret-token}
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ROOT: /host/root

    ports:
      - "8080:8080"

    extra_hosts:
      - "srv-01:100.75.107.88"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/serverdeck/bridge.sock:/var/run/serverdeck/bridge.sock
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /mnt/DATA:/mnt/DATA:ro
      - ./config:/app/config
      - ./data:/app/data

    privileged: true
    pid: host
