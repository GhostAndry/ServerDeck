<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#152136"/>
      <stop offset="55%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#04060A"/>
    </radialGradient>

    <!-- Ambient Center Cyan Glow (Enlarged) -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Server Blade Metal Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A3852"/>
      <stop offset="10%" stop-color="#1E273A"/>
      <stop offset="90%" stop-color="#131826"/>
      <stop offset="100%" stop-color="#0D111C"/>
    </linearGradient>

    <!-- Blade Border Highlight Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#718096" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#3B4961" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Top Glass Sheen Gradient -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Telemetry Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#00F0FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15"/>
    </linearGradient>

    <!-- LED Gradients -->
    <radialGradient id="cyanLedGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EBF9FF"/>
      <stop offset="45%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>

    <radialGradient id="greenLedGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EFFFF9"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="dropShadowBlade" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPulse" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- 2. Subtle Cyberpunk Grid Lines -->
  <g stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.04">
    <line x1="96" y1="0" x2="96" y2="1024"/>
    <line x1="224" y1="0" x2="224" y2="1024"/>
    <line x1="352" y1="0" x2="352" y2="1024"/>
    <line x1="480" y1="0" x2="480" y2="1024"/>
